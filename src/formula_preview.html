<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sniplite · 公式预览</title>
<link rel="stylesheet" href="katex/katex.min.css">
<style>
:root{color-scheme:light;--ink:#193252;--muted:#71839a;--line:#dce5ef;--blue:#3579e8;--blue-soft:#edf4ff;--paper:#fff;--canvas:#f1f5fa;--green:#24966c}
*{box-sizing:border-box}
body{height:100vh;min-width:620px;min-height:500px;margin:0;overflow:hidden;background:radial-gradient(ellipse at 15% 0%,#e6f0ff 0,transparent 42%),var(--canvas);color:var(--ink);font:14px/1.5 "Microsoft YaHei UI","Segoe UI",sans-serif}
.app{height:100%;display:grid;grid-template-rows:54px minmax(0,1fr);gap:12px;padding:12px 14px 14px}
.topbar,.brand,.live{display:flex;align-items:center}
.topbar{justify-content:space-between;padding:0 4px}
.brand{gap:11px;min-width:0}
.brand-mark{width:36px;height:36px;display:grid;place-items:center;border:1px solid #cfe0fb;border-radius:12px;background:linear-gradient(145deg,#fff,#eaf2ff);color:var(--blue);font:italic 20px Georgia,serif;box-shadow:0 4px 12px #3579e81c}
.brand-copy{min-width:0}
.brand h1{margin:0;color:#1b3556;font-size:15px;line-height:1.35;font-weight:700}
.brand p{margin:2px 0 0;color:var(--muted);font-size:11px;line-height:1.3}
.live{gap:7px;padding:6px 10px;border:1px solid #dcebe5;border-radius:999px;background:#f6fbf8;color:#438269;font-size:11px;font-weight:600}
.live-dot{width:7px;height:7px;border-radius:50%;background:#36aa7d;box-shadow:0 0 0 3px #36aa7d1c}
.card-title,.editor-actions{display:flex;align-items:center}
.workspace{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(270px,.85fr);gap:12px;min-height:0}
.card{display:flex;min-width:0;min-height:0;flex-direction:column;overflow:hidden;border:1px solid #dbe4ef;border-radius:15px;background:var(--paper);box-shadow:0 8px 24px #29466d0d}
.card-head{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #edf1f6}
.card-title{gap:9px;font-size:13px;font-weight:700}
.title-icon{width:26px;height:26px;display:grid;place-items:center;border-radius:9px;background:var(--blue-soft);color:var(--blue);font-size:13px}
.tag{padding:4px 9px;border:1px solid #e3eaf2;border-radius:999px;background:#f8fafc;color:#71839a;font-size:10px;font-weight:600;letter-spacing:.03em}
.preview{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:22px;background-color:#f8faff;background-image:radial-gradient(#d9e4f3 0.8px,transparent 0.8px);background-size:18px 18px}
#preview{max-width:100%;overflow:auto;padding:24px 30px;border:1px solid #e4ebf4;border-radius:14px;background:linear-gradient(145deg,#fff,#fcfdff);box-shadow:0 10px 28px #29466d0c;text-align:center}
#preview .katex-display{margin:0;font-size:1.4em}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);text-align:center}
.empty-mark{width:48px;height:48px;display:grid;place-items:center;border:1px solid #dce9fb;border-radius:15px;background:#f3f8ff;color:#5a8bd2;font:italic 20px Georgia,serif}
.empty strong{color:#4c617b;font-size:14px;font-weight:600}
.empty span:last-child{font-size:12px}
.preview-foot{flex:none;padding:9px 14px;border-top:1px solid #edf1f6;color:#8492a5;font-size:11px}
.editor{flex:1;min-height:0;display:flex;padding:11px}
.editor textarea{width:100%;height:100%;min-height:0;resize:none;border:1px solid #e0e7f0;border-radius:11px;background:#f8fafd;padding:13px;color:#263d59;font:12.5px/1.75 Consolas,"Cascadia Code","Microsoft YaHei UI",monospace;outline:none;tab-size:2;transition:border-color .15s,box-shadow .15s,background .15s}
.editor textarea:focus{border-color:#8db7f2;box-shadow:0 0 0 3px #3579e814;background:#fff}
.editor-actions{min-height:52px;flex:none;justify-content:space-between;gap:10px;padding:0 11px 11px;color:#8492a5;font-size:11px}
.copy-state{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy-state.error{color:#b94b58}
#copy{flex:none;border:0;border-radius:9px;background:linear-gradient(135deg,#4389f5,#2869d2);padding:8px 13px;color:white;font:600 12px "Microsoft YaHei UI","Segoe UI",sans-serif;box-shadow:0 4px 10px #3579e82b;cursor:pointer;transition:background .15s,transform .15s,box-shadow .15s}
#copy:focus-visible{outline:3px solid #3579e855;outline-offset:2px}
#copy:hover{background:linear-gradient(135deg,#347de9,#205fc4);box-shadow:0 6px 14px #3579e83b;transform:translateY(-1px)}
#copy:disabled{background:#a7b7ca;box-shadow:none;cursor:default;transform:none}
@media(max-width:680px){body{min-width:520px}.app{gap:9px;padding:10px}.workspace{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:10px}.topbar{padding:0 2px}.card-head{height:44px}.preview{padding:12px}#preview{padding:18px 20px}.editor{padding:9px}}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">ƒx</span>
      <div class="brand-copy">
        <h1>公式预览</h1>
        <p>编辑 LaTeX，实时查看渲染结果</p>
      </div>
    </div>
    <span class="live"><span class="live-dot" aria-hidden="true"></span>实时预览</span>
  </header>
  <div class="workspace">
    <section class="card" aria-label="公式预览">
      <header class="card-head">
        <div class="card-title"><span class="title-icon" aria-hidden="true">∑</span>渲染结果</div>
        <span class="tag">KaTeX</span>
      </header>
      <div class="preview"><div id="preview" aria-live="polite"><div class="empty"><span class="empty-mark">ƒx</span><strong>等待公式</strong><span>识别结果会显示在这里</span></div></div></div>
      <footer class="preview-foot">编辑源码后，预览会即时更新</footer>
    </section>
    <section class="card" aria-label="LaTeX 源码编辑">
      <header class="card-head">
        <div class="card-title"><span class="title-icon" aria-hidden="true">&lt;/&gt;</span>LaTeX 源码</div>
        <span class="tag" id="char-count">0 字符</span>
      </header>
      <div class="editor"><textarea id="source" spellcheck="false" aria-label="LaTeX 源码" placeholder="在此编辑 LaTeX 公式"></textarea></div>
      <footer class="editor-actions">
        <span class="copy-state" id="copy-state" aria-live="polite">Ctrl+Enter 复制源码</span>
        <button id="copy" type="button" title="Ctrl+Enter" aria-keyshortcuts="Control+Enter" disabled>复制源码</button>
      </footer>
    </section>
  </div>
</main>
<script src="katex/katex.min.js"></script>
<script>
const source=document.getElementById('source');
const preview=document.getElementById('preview');
const copy=document.getElementById('copy');
const count=document.getElementById('char-count');
const copyState=document.getElementById('copy-state');
try{source.value=decodeURIComponent(location.hash.slice(1));}catch{source.value=location.hash.slice(1);}
function syntaxStatus(){
  const invalid=preview.querySelector('.katex-error');
  copyState.classList.toggle('error',!!invalid);
  copyState.textContent=invalid?'公式语法有误':'Ctrl+Enter 复制源码';
}
function render(){
  const text=source.value.trim();
  count.textContent=`${source.value.length} 字符`;
  copy.disabled=!source.value;
  if(!text){preview.innerHTML='<div class="empty"><span class="empty-mark">ƒx</span><strong>等待公式</strong><span>识别结果会显示在这里</span></div>';syntaxStatus();return;}
  try{katex.render(text,preview,{displayMode:true,throwOnError:false,strict:'ignore'});syntaxStatus();}
  catch(e){preview.textContent=e.message;copyState.classList.add('error');copyState.textContent='公式语法有误';}
}
source.addEventListener('input',render);
async function copySource(){
  if(copy.disabled)return;
  let ok=false;
  try{await navigator.clipboard.writeText(source.value);ok=true;}
  catch{
    const start=source.selectionStart,end=source.selectionEnd;
    source.focus();source.select();
    try{ok=document.execCommand('copy');}catch{ok=false;}
    source.setSelectionRange(start,end);
  }
  copyState.classList.toggle('error',!ok);
  copyState.textContent=ok?'已复制到剪贴板':'复制失败';
  if(ok)setTimeout(syntaxStatus,1200);
}
source.addEventListener('keydown',event=>{
  if(event.ctrlKey&&event.key==='Enter'){event.preventDefault();copySource();}
});
copy.addEventListener('click',copySource);
render();
</script>
</body>
</html>
